<div class="product-card" (click)="onCardClick($event)">
  <div class="image-wrapper">
    <img [src]="getImageUrl(product.images)" [alt]="product.productName">

    <!-- Floating Badge -->
    <span class="deal-badge" *ngIf="product.discount">Deals Available</span>

    <!-- Floating Actions -->
    <div class="floating-actions">
      <button class="action-btn cart-btn" (click)="handleAddToCart($event)" title="Add to Cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
      </button>
      <button class="action-btn wishlist-btn"
              [class.active]="isBookmarked()"
              (click)="toggleBookmark($event)"
              title="Bookmark">
        <svg width="16" height="16" viewBox="0 0 24 24" [attr.fill]="isBookmarked() ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.82-8.82 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="product-info">
    <h3 class="product-name" [routerLink]="['/process/context/product-overview', getProductId()]">{{product.productName}}</h3>

    <div class="rating-row">
      <span class="rating-value">{{product.rating || 4.3}}</span>
      <div class="stars">
        <span class="star" *ngFor="let s of [1,2,3,4,5]; let i = index" [class.active]="i < (product.rating || 4.3)">★</span>
      </div>
      <a class="reviews-link" (click)="$event.stopPropagation()">135 Reviews</a>
    </div>

    <div class="price-row">
      <span class="current-price">{{product.actualPrice | number:'1.0-0'}} LKR</span>
      <span class="original-price" *ngIf="product.oldPrice">{{product.oldPrice | number:'1.0-0'}} LKR</span>
    </div>

    <div class="countdown-row">
      <span class="timer">d 10: h 11: m 05: s 11</span>
    </div>
  </div>
</div>
