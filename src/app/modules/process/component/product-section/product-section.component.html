<section class="products-section">
  <div class="container">
    <h2 class="section-title">Recommended for You</h2>

    <div class="products-grid" *ngIf="products.length > 0; else loading">
      <app-product-card
        *ngFor="let product of products; trackBy: trackById"
        [product]="product">
      </app-product-card>
    </div>

    <ng-template #loading>
      <div class="loading-state">
        <p>Loading products...</p>
      </div>
    </ng-template>
  </div>
</section>
